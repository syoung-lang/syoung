    a{

        transition: 0.3s;
        padding:10px;
    }

    a:hover{
        cursor: pointer;
        color: black;
        transform: scale(1.05);
    }

    .cutton{

    .cutton:hover{
        cursor: pointer;
        transform: scale(1.05);
        filter: drop-shadow(0px 0px 7px #dadada);
    }

    .cutton:active{
        transform: scale(.98);
    }
